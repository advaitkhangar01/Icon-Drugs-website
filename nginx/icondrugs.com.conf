# Nginx configuration for icondrugs.com on VPS 46.202.162.79
# Place in: /etc/nginx/sites-available/icondrugs.com
# Symlink to: /etc/nginx/sites-enabled/icondrugs.com

upstream nextjs_upstream {
    server 127.0.0.1:3005;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    server_name icondrugs.com www.icondrugs.com;

    # Redirect all HTTP requests to HTTPS (uncomment after obtaining SSL with Certbot)
    # return 301 https://$host$request_uri;

    # Gzip Compression
    gzip on;
    gzip_proxied any;
    gzip_comp_level 4;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Static assets caching
    location /_next/static {
        proxy_cache_valid 200 365d;
        proxy_pass http://nextjs_upstream;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /public {
        proxy_cache_valid 200 30d;
        proxy_pass http://nextjs_upstream;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Main reverse proxy
    location / {
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
